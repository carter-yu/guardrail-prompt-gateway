[project]
name = "guardrail-prompt-gateway"
version = "0.2.0"
description = "Learning demo: deterministic prompt gates around a pinned LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "structlog",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/guardrail_prompt_gateway",
    "src/lib",
    "src/schemas",
    "src/services",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
